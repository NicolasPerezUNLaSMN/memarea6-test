services:
  memareavi:
    build: .
    image: smn/memareavi:latest
    container_name: memareavi
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      # Historial de boletines (json + txt). Hacer backup de esta carpeta.
      - ./data:/data
      # Catálogo de términos: se puede editar sin reconstruir la imagen
      # (reiniciar el contenedor después de editar).
      - ./app/config/catalogo.yaml:/app/config/catalogo.yaml:ro
      # Credenciales del ingreso con Microsoft/Google: descomentar SOLO cuando
      # exista .streamlit/secrets.toml (ver secrets.toml.example). Si el archivo
      # no existe, Docker crea una carpeta con ese nombre en su lugar.
      # - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
