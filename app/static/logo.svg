      <path d="M22 41 H54 L49 48 H27 Z" fill="#F26B4F"/>
    </g>
    <!-- olas -->
    <path d="M0 50 q8 -6 16 0 t16 0 t16 0 t16 0 V64 H0 Z" fill="#2BA3B8"/>
    <path d="M0 56 q8 -5 16 0 t16 0 t16 0 t16 0 V64 H0 Z" fill="#1B7F98"/>
    <path d="M4 50 q4 -3 8 0" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
    <path d="M36 50 q4 -3 8 0" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
