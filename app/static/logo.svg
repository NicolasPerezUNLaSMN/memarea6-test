<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="meMareaVI">
  <defs>
    <clipPath id="c"><rect x="0" y="0" width="64" height="64" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <!-- cielo -->
    <rect width="64" height="64" fill="#0E5A7A"/>
